name: tabang
description: "TABANG - Blood Donation Locator & Community Platform"
publish_to: 'none' # Remove this line if you plan to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8

  # --- Database & Backend ---
  supabase_flutter: ^2.8.0

  # --- Maps & Geolocation ---
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter for recommended Flutter code style rules
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Asset management for local images, geojson files, or custom fonts
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Custom fonts configuration
  # fonts:
  #   - family: Arial
  #     fonts:
  #       - asset: fonts/Arial.ttf
  #       - asset: fonts/Arial-Bold.ttf
  #         weight: 700