name: tabang
description: "TABANG - Transfusion Access, Blood Availability and Network Guidance. A centralized donor management system for Digos City."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8

  # --- Credential hashing for the local auth store ---
  crypto: ^3.0.3

  # --- Maps ---
  # No maps SDK is used. Find Donor renders the bundled barangay GeoJSON with
  # a CustomPainter, so there is no API key, no tile traffic and no platform
  # view. See lib/screens/donor/find_donor_page.dart.
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

  # Supabase is intentionally not a dependency in this simulated build. The
  # backend migration is documented as a known gap instead of shipping an
  # unused client that implies a live connection.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/maps/
    - assets/images/
    - assets/branding/
